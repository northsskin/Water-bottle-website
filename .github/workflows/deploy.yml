name: Build the site into docs/

# Pages has been served from a branch for this repo, which publishes the
# repository as-is and cannot build a Vite app — that is what handed the
# browser src/main.jsx as raw JSX and rendered a blank page.
#
# So the build output is committed. `npm run build` writes to docs/, which is
# the one sub-directory a branch-served Pages site will serve, and the first job
# keeps it in step with the source on every push. docs/.nojekyll (copied from
# public/) turns Jekyll off, so Pages copies the files across rather than trying
# to render them.
#
# The second job also publishes the same directory as a Pages artifact, for the
# case where Settings → Pages → Source is "GitHub Actions" instead. It is
# allowed to fail: exactly one of the two routes is live at a time, and which
# one cannot be read from here (the Actions token gets 403 on the Pages config
# endpoint). Both publish identical bytes, so whichever is in force is correct
# and there is nothing left for them to race over.

on:
  push:
    # Trim this list to your default branch once the repo settles.
    branches:
      - main
      - master
      - claude/new-session-uc1tl6
    # Without this, committing docs/ below would retrigger this workflow.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # to push the rebuilt docs/
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Normally a no-op: docs/ is committed alongside the source it was built
      # from, so this only fires if someone pushed a source change without
      # rebuilding. Untracked files count, since a new hashed chunk filename is
      # a new file rather than a modification.
      - name: Commit docs/ if it drifted from the source
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs/ already matches the source — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs/ from ${GITHUB_SHA:0:7}"
          git push

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: docs

  # Only does anything when the Pages source is "GitHub Actions"; when it is a
  # branch, this fails and the branch pipeline publishes the same docs/ instead.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
