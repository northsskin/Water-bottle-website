name: Deploy to GitHub Pages

# GitHub Pages cannot build a Vite app on its own — the "deploy from a branch"
# setting publishes the repository as-is, which serves src/main.jsx to the
# browser as raw JSX and renders a blank page. This workflow builds first and
# publishes dist/ instead.
#
# Set Settings → Pages → Source to "GitHub Actions" for this to take effect.

on:
  push:
    # Trim this list to your default branch once the repo settles.
    branches:
      - main
      - master
      - claude/new-session-uc1tl6
  workflow_dispatch:

# Allow the workflow to mint a Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
