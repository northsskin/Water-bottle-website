name: Build the site into docs/

# GitHub Pages is serving this repository from a branch, which publishes the
# repo as-is — it cannot build a Vite app. Handing the browser src/main.jsx as
# raw JSX is what rendered a blank page.
#
# So the build output is committed instead: `npm run build` writes to docs/,
# which is the one sub-directory Pages will serve, and this workflow keeps it
# in step with the source on every push. docs/.nojekyll (copied from public/)
# turns Jekyll off, so Pages just copies the files across.
#
# This means no manual settings change is required, and there is no longer a
# race between two publishers: whatever is in docs/ is the site.

on:
  push:
    # Trim this list to your default branch once the repo settles.
    branches:
      - main
      - master
      - claude/new-session-uc1tl6
    # Without this, committing docs/ below would retrigger this workflow.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

# Needed to push the rebuilt docs/ back to the branch.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Normally a no-op: docs/ is committed alongside the source it was built
      # from, so this only fires if someone pushed a source change without
      # rebuilding. Untracked files count, since a new hashed chunk filename is
      # a new file rather than a modification.
      - name: Commit docs/ if it drifted from the source
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs/ already matches the source — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs/ from ${GITHUB_SHA:0:7}"
          git push
