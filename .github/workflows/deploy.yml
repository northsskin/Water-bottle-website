name: Deploy to GitHub Pages

# GitHub Pages cannot build a Vite app on its own — the "deploy from a branch"
# setting publishes the repository as-is, which serves src/main.jsx to the
# browser as raw JSX and renders a blank page. This workflow builds first and
# publishes dist/ instead.
#
# Set Settings → Pages → Source to "GitHub Actions" for this to take effect.

on:
  push:
    # Trim this list to your default branch once the repo settles.
    branches:
      - main
      - master
      - claude/new-session-uc1tl6
  workflow_dispatch:

# Allow the workflow to mint a Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # While the Pages source is a branch, GitHub's built-in Jekyll pipeline
      # ALSO publishes on every push, republishing the repository as-is — and
      # whichever finishes last wins, so the site randomly reverts to raw
      # source and goes blank. Only a repo admin can change the source: the
      # Actions token gets 403 on the Pages config endpoint, so this reports
      # the problem rather than pretending to fix it.
      - name: Check the Pages source
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::warning::Pages Source is '$build_type', not GitHub Actions, so GitHub's branch pipeline is publishing raw source over this build. Fix it at Settings → Pages → Source → GitHub Actions, then delete the 'Let the branch pipeline go first' step from this workflow."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # TEMPORARY — delete once Settings → Pages → Source is "GitHub Actions".
      # Until then GitHub's branch pipeline publishes the raw source on this
      # same push and the last writer wins. That coin flip has already blanked
      # the site once (it finished 12s after this deploy). Letting it go first
      # makes this build the one that survives.
      - name: Let the branch pipeline go first
        run: sleep 90

      - id: deployment
        uses: actions/deploy-pages@v4
